name: Freerider transport routes public API probe
on:
  push:
    paths:
      - .github/workflows/transport-api-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public route response
        shell: python
        run: |
          import json
          from urllib.request import Request,urlopen
          urls=[
            'https://hertzfreerider.no/api/transport-routes/?country=NORWAY',
            'https://hertzfreerider.se/api/transport-routes/?country=SWEDEN',
          ]
          for url in urls:
              print('PROBE',url,flush=True)
              try:
                  req=Request(url,headers={'User-Agent':'Freerider-HA-development-probe/0.1 (Wesc-9/Freerider_HA)','Accept':'application/json'})
                  r=urlopen(req,timeout=15)
                  data=r.read(800000)
                  print('HTTP',r.status,'TYPE',r.headers.get('content-type'),'BYTES',len(data),flush=True)
                  result=json.loads(data)
                  print('JSON_TYPE',type(result).__name__,flush=True)
                  if isinstance(result,dict):
                      print('ROOT_KEYS',list(result)[:20],flush=True)
                      for k,v in result.items():
                          print('VALUE',k,'TYPE',type(v).__name__,'LEN',len(v) if isinstance(v,(list,dict)) else None,flush=True)
                          if isinstance(v,list) and v:
                              print('ITEM',json.dumps(v[0],ensure_ascii=False)[:1800],flush=True)
                  elif isinstance(result,list):
                      print('COUNT',len(result),flush=True)
                      for x in result[:2]:print('ITEM',json.dumps(x,ensure_ascii=False)[:1800],flush=True)
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:350],flush=True)
