name: Public Freerider site diagnostic
on:
  push:
    paths:
      - .github/workflows/freerider-site-probe.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public pages conservatively
        shell: python
        run: |
          import re
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          from html import unescape
          sites = [
              "https://hertzfreerider.nu/robots.txt",
              "https://hertzfreerider.nu/booking/",
              "https://hertzfreerider.nu/booking/?page=2",
              "https://hertzfreerider.nu/booking/3-biler/1389-toyota-proace-aut-ev75792-billund-til-aalborg/",
              "https://hertzfreerider.no/no-no/",
              "https://hertzfreerider.se/sv-se/",
          ]
          for url in sites:
              print("PROBE", url, flush=True)
              try:
                  r = urlopen(Request(url, headers={"User-Agent":"Freerider-HA-development-probe/0.1 (GitHub Wesc-9/Freerider_HA)"}), timeout=15)
                  b = r.read(350_000)
                  html = b.decode("utf-8", errors="replace")
                  print("HTTP", r.status, "bytes", len(b), flush=True)
                  if url.endswith("robots.txt"):
                      print("ROBOTS", html[:1500].replace("\n", " | "), flush=True)
                      continue
                  for term in ("Toyota", "booking/3-biler/", "1389", "m-productlist", "m-product", "product-card", "product-item", "product-list", "product_id", "På lager", "Ikke på lager"):
                      matches=list(re.finditer(re.escape(term),html,re.I))
                      m=matches[-1] if matches else None
                      if m: print("SNIPPET",term,re.sub(r"\\s+"," ",html[max(0,m.start()-420):m.end()+320])[:900],flush=True)
                  print("SCRIPTS",re.findall(r'<script[^>]+src="([^"]+)"',html,re.I)[-12:],flush=True)
                  print("TITLE", re.findall(r"<title[^>]*>(.*?)</title>", html, flags=re.S|re.I)[:2], flush=True)
                  for kind, regex in [
                      ("LINKS", r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>'),
                      ("STOCK", r'.{0,160}(?:På lager|Ikke på lager|udsolgt|lagerstatus).{0,180}'),
                      ("JSON", r'.{0,100}(?:__NEXT_DATA__|window\.__|graphql|/api/).{0,120}')
                  ]:
                      matches = re.findall(regex, html, re.S|re.I)
                      if kind=="LINKS":
                          matches = [(h, re.sub(r"<[^>]+>", " ",v).strip()[:70]) for h,v in matches if "/booking/" in h or "script" in h][:8]
                      print(kind, [re.sub(r"\s+"," ",str(x))[:240] for x in matches[:12]], flush=True)
              except Exception as exc:
                  print("ERROR", type(exc).__name__, str(exc)[:300], flush=True)
