name: Probe Freerider booking links
on:
  push:
    paths: ['.github/workflows/probe-booking-links.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct booking routes and pickup validation
        run: |
          python - <<'PY'
          import requests,re
          urls=[
           'https://hertzfreerider.no/booking-flow/no-no',
           'https://hertzfreerider.se/booking-flow/sv-se',
           'https://hertzfreerider.no/page-data/booking-flow/no-no/page-data.json',
           'https://hertzfreerider.se/page-data/booking-flow/sv-se/page-data.json',
           'https://hertzfreerider.no/component---src-templates-booking-flow-tsx-5ca4adf91cca8b5747e4.js',
          ]
          for url in urls:
            try:
              r=requests.get(url,timeout=25)
              print('RESOURCE',r.status_code,r.url,len(r.content),r.text[:150] if 'page-data/' in url else '',flush=True)
              if 'component---' in url and r.status_code==200:
                text=r.text
                ix=text.find('$=(0,')
                snippet=text[text.find('notProcessed'):text.find('notProcessed')+5700]
                print('VALIDATION',snippet[:5500],flush=True)
            except Exception as e:print('ERROR',repr(e),flush=True)
          PY
