name: Probe Freerider booking links
on:
  push:
    paths: ['.github/workflows/probe-booking-links.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decode locale and query-string modules
        run: |
          python - <<'PY'
          import requests,re
          base='https://hertzfreerider.no/'
          js=requests.get(base+'webpack-runtime-8ff3d6a51ee6d9b098e6.js',timeout=25).text
          pat=r'a.u=function\\(e\\)\\{return(\\{.+?\\})\\[e\\]\\+"-"\\+(\\{.+?\\})\\[e\\]\\+"\\.js"'
          m=re.search(pat,js)
          print('RUNTIME_MAP',bool(m),flush=True)
          print('RUNTIME_SNIPPET',js[js.find('a.u=function'):js.find('a.u=function')+3100],flush=True)
          runtime=js[js.find('a.u=function'):js.find('a.u=function')+1350]
          nameset=runtime.split('return{',1)[1].split('}[e]+"-"+',1)
          names={int(k):v for k,v in re.findall(r'([0-9]+):"([^"]+)"',nameset[0])}
          hashes={int(k):v for k,v in re.findall(r'([0-9]+):"([^"]+)"',nameset[1].split('}[e]+',1)[0])}
          chunks=[names[k]+'-'+hashes[k]+'.js' for k in names]
          print('CHUNKS',chunks,flush=True)
          for name in chunks:
            try:
              r=requests.get(base+name,timeout=25)
            except Exception:continue
            s=r.text
            if r.status_code!=200: continue
            for module in ['9691','758','6141']:
              needle=module+':function'
              ix=s.find(needle)
              if ix>=0:print('MODULE',module,'FILE',name,'JS',s[ix:ix+3300],flush=True)
          PY
