name: Probe Freerider booking links
on:
  push:
    paths:
      - '.github/workflows/probe-booking-links.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect actual Freerider Gatsby route and booking flow
        run: |
          python - <<'PY'
          import requests,re
          from urllib.parse import urljoin
          base='https://hertzfreerider.no'
          urls=[
              base+'/component---src-templates-start-tsx-711208a1da0171ccda5f.js',
              base+'/page-data/no-no/page-data.json',
              base+'/page-data/index/page-data.json',
              base+'/page-data/app-data.json',
              base+'/webpack-runtime-8ff3d6a51ee6d9b098e6.js'
          ]
          for url in urls:
              try:
                r=requests.get(url,timeout=25)
                print('RESOURCE',r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                text=r.text
                if 'javascript' not in r.headers.get('content-type','') and url.endswith('.js') and len(text)<10000:
                  print('CONTENT',text[:400],flush=True)
                if 'page-data' in url:
                  print('CONTENT',text[:1900],flush=True)
                if 'webpack-runtime' in url:
                  for term in ('component---src-templates-start','711208a1da0171ccda5f','104:'):
                    ix=text.find(term)
                    print('LOOKUP',term,ix,text[max(0,ix-160):ix+260] if ix>=0 else '',flush=True)
                if r.status_code!=200 or len(text)<30000: continue
                for term in ('selectedRoute','booking_flow','sessionStorage.setItem','setSelectedRoute','handleClick:async','transportOfferId','/book','/booking','/no-no','/sv-se','navigateTo'):
                  hits=list(re.finditer(re.escape(term),text,re.I))
                  print('TERM',term,len(hits),flush=True)
                  for h in hits[:9]:
                    print('CONTEXT',text[max(0,h.start()-250):h.end()+350][:690],flush=True)
              except Exception as e:print('ERROR',str(e),flush=True)
          PY
