name: Probe Freerider booking links
on:
  push:
    paths: ['.github/workflows/probe-booking-links.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find booking hash constants and locale URL
        run: |
          python - <<'PY'
          import requests,re
          base="https://hertzfreerider.no/"
          names=[
          "app-39437c55b75f4d1a2470.js",
          "7c6e4af9-b55a4cc3e3b96ff0fa8b.js",
          "0b256fc4-54501eb77faa357eea95.js",
          "framework-9c1cec184b7d374cfed8.js",
          "component---src-templates-booking-flow-tsx-5ca4adf91cca8b5747e4.js",
          "component---src-templates-start-tsx-711208a1da0171ccda5f.js"
          ]
          for name in names:
            r=requests.get(base+name,timeout=25)
            content=r.text
            print("RESOURCE",r.status_code,len(content),name,flush=True)
            if r.status_code!=200: continue
            for module in ("9691","758","6141","6018","975"):
              for pattern in [rf'(?<!\\d){module}:function',rf'(?<!\\d){module}:\\(\\w,\\w,\\w\\)=>']:
                m=re.search(pattern,content)
                if m:
                  print("MODULE",module,content[m.start():m.start()+2400],flush=True)
                  break
            for term in ['urlIsoPickupDate','urlId','urlInsurances','queryParams','booking_flow','bookingFlow','/booking/','"/no-no/']:
              hits=list(re.finditer(re.escape(term),content,re.I))
              for hit in hits[:2]:
                print("SEARCH",term,content[max(0,hit.start()-180):hit.end()+250][:460],flush=True)
          PY
