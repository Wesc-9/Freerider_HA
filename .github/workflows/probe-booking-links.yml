name: Probe Freerider booking links
on:
  push:
    paths:
      - '.github/workflows/probe-booking-links.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect URL and persisted selected offer in Gatsby
        run: |
          python - <<'PY'
          import requests,re
          base='https://hertzfreerider.no'
          urls=[
            base+'/component---src-templates-start-tsx-711208a1da0171ccda5f.js',
            base+'/component---src-templates-booking-flow-tsx-5ca4adf91cca8b5747e4.js',
            base+'/app-39437c55b75f4d1a2470.js'
          ]
          for url in urls:
            response=requests.get(url,timeout=25)
            js=response.text
            print('RESOURCE',response.status_code,url,len(js),flush=True)
            if response.status_code!=200: continue
            pats=['selectedRoute','sessionStorage.getItem','sessionStorage.setItem','window.location.search','URLSearchParams','location.search','booking_flow','booking-flow','transportOfferId','routeId','selectedCarDrawer','setSelectedRoute','navigate(','queryParams','queryString']
            for pat in pats:
              hits=list(re.finditer(re.escape(pat),js,re.I))
              if hits:print('PATTERN',pat,'COUNT',len(hits),flush=True)
              for m in hits[:7]:
                before=js[max(0,m.start()-280):m.end()+430]
                print('EXCERPT',pat,before[:740],flush=True)
          PY
