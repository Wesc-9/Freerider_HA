name: Probe Freerider booking links
on:
  push:
    paths: ['.github/workflows/probe-booking-links.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract official Freerider direct-link contract
        run: |
          python - <<'PY'
          import requests,re
          base='https://hertzfreerider.no'
          urls=[
            base+'/component---src-templates-booking-flow-tsx-5ca4adf91cca8b5747e4.js',
            base+'/app-39437c55b75f4d1a2470.js',
            base+'/sitemap.xml',
            base+'/page-data/no-no/booking-flow/page-data.json',
            base+'/page-data/no-no/booking/page-data.json',
            base+'/page-data/no-no/bestilling/page-data.json'
          ]
          for url in urls:
            r=requests.get(url,timeout=25)
            s=r.text
            print('RESOURCE',r.status_code,len(s),url,flush=True)
            if r.status_code!=200:continue
            if '/sitemap' in url:print('CONTENT',s[:3800],flush=True)
            if '/page-data/' in url:print('CONTENT',s[:600],flush=True)
            if not url.endswith('.js'):continue
            for id in ('9691','6141','758','booking_flow','BOOKING_FLOW','booking-flow','selectedRoute','/booking-flow/'):
              if id.isnumeric():
                for pattern in (id+':function',id+':(e',id+':(t'):
                  idx=s.find(pattern)
                  if idx>=0:print('MODULE',id,s[idx:idx+1700],flush=True)
              else:
                hits=list(re.finditer(re.escape(id),s,re.I))
                print('HITS',id,len(hits),flush=True)
                for hit in hits[-5:]:
                  print('NEAR',id,s[max(0,hit.start()-250):hit.end()+310][:600],flush=True)
          PY
