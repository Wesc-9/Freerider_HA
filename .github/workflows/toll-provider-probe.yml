name: Toll provider contract diagnostic
on:
  push:
    paths:
      - .github/workflows/toll-provider-probe.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run a single documented public Norwegian toll example
        shell: python
        run: |
          from urllib.parse import urlencode
          from urllib.request import urlopen, Request
          import json
          params = urlencode({"from":"59.9139,10.7522","to":"59.7440,10.2045","refine":"1"})
          url = "https://bompengeappen.no/api/route?" + params
          try:
              req = Request(url, headers={"Accept":"application/json", "User-Agent":"Freerider_HA/0.3-alpha validation (Wesc-9/Freerider_HA)"})
              with urlopen(req, timeout=55) as response:
                  data = json.load(response)
                  print("HTTP",response.status, "CONTENT_TYPE",response.headers.get("Content-Type"),flush=True)
              print("BILLING_KEYS",sorted(data.get("_billing",{}).keys()),flush=True)
              billing = data.get("_billing",{}).get("routes",[])
              print("HAS_ROUTES",bool(billing),flush=True)
              if billing:
                  row = billing[0]
                  print("RATE_FIELDS",{k:row.get(k) for k in ("tollSmall", "tollSmallNoDiscount", "tollSmallEvNoDiscount", "tollCount", "ferryCount", "chargedStations") if k != "chargedStations"},flush=True)
                  print("STATION_COUNT",len(row.get("chargedStations",[])),flush=True)
          except Exception as exc:
              print("PROVIDER_TEST_ERROR",type(exc).__name__,str(exc)[:350],flush=True)
